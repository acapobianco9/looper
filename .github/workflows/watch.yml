name: LI Links
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths-ignore: ["state.json", "seen.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: lilinks
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python looper.py run
      - name: persist state
        run: |
          if [ -n "$(git status --porcelain seen.json state.json)" ]; then
            git config user.name lilinks
            git config user.email actions@users.noreply.github.com
            git add seen.json state.json
            git commit -m "state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep 3
            done
            echo "state push skipped (will refresh next run)"
          fi
