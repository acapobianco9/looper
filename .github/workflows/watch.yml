name: looper
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: looper
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python looper.py run
      - name: persist state
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name looper
            git config user.email actions@users.noreply.github.com
            git add seen.json
            git commit -m "state [skip ci]"
            git push
          fi
